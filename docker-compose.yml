services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - QUANTMIND_URL=http://quantmind:8010
      - QUANTMIND_SERVICE_TOKEN=${QUANTMIND_SERVICE_TOKEN:-}
      - ATOM_DB_PATH=/app/atom_reports.db
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - redis
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  quantmind:
    profiles: [research]
    build:
      context: ./research
    restart: unless-stopped
    environment:
      - QUANTMIND_SERVICE_TOKEN=${QUANTMIND_SERVICE_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - QUANTMIND_MODEL=${QUANTMIND_MODEL:-gpt-4o-mini}
      - QUANTMIND_DB_PATH=/data/research.db
    volumes:
      - research_data:/data
    expose:
      - "8010"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    command: npm run dev -- --host 0.0.0.0

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  research_data:
