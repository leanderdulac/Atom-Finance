# ════════════════════════════════════════════════════════════════
#  ATOM — Production Docker Compose
#  Usage: docker-compose -f docker-compose.prod.yml up -d
#
#  Required env vars (set in a .env file or via secrets manager):
#    SECRET_KEY, ATOM_DATABASE_URL, BRAPI_TOKEN, ANTHROPIC_API_KEY,
#    OPENAI_API_KEY, XAI_API_KEY, PERPLEXITY_API_KEY
#
#  ATOM_DATABASE_URL must point at a managed Postgres instance (e.g.
#  DigitalOcean/RDS/Cloud SQL) — this stack deliberately does not run its
#  own Postgres container, so backups/HA/PITR come from the provider
#  instead of being reinvented here. Run `alembic upgrade head` (from
#  backend/, with ATOM_DATABASE_URL set) against it before first deploy.
# ════════════════════════════════════════════════════════════════

services:

  # ── Backend (FastAPI + Uvicorn — production mode) ──────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - QUANTMIND_URL=http://quantmind:8010
      - QUANTMIND_SERVICE_TOKEN=${QUANTMIND_SERVICE_TOKEN:-}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ATOM_ENV=production
      - ATOM_ALLOW_REGISTRATION=${ATOM_ALLOW_REGISTRATION:-false}
      - OPLAB_ACCESS_TOKEN=${OPLAB_ACCESS_TOKEN:-}
      - OPLAB_OWNER=${OPLAB_OWNER:-}
      - CEDRO_SESSION_COOKIE=${CEDRO_SESSION_COOKIE:-}
      - CEDRO_OWNER=${CEDRO_OWNER:-}
      - ATOM_DATABASE_URL=${ATOM_DATABASE_URL:?ATOM_DATABASE_URL is required — see the header comment above}
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_URL=${FRONTEND_URL:-https://atom.yourdomain.com}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://atom.yourdomain.com}
      - BRAPI_TOKEN=${BRAPI_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - BINANCE_BASE_URL=${BINANCE_BASE_URL:-https://api.binance.com}
      - BINANCE_FUTURES_URL=${BINANCE_FUTURES_URL:-https://fapi.binance.com}
      - BRIDGEWISE_TOKEN=${BRIDGEWISE_TOKEN:-}
      - ACCESS_TOKEN_EXPIRE_HOURS=24
      # Per-client rate limiting behind nginx: trust the X-Forwarded-For the
      # frontend proxy sets ($proxy_add_x_forwarded_for). Only enable while the ONLY
      # path to /api is through that nginx (it is, here).
      - ATOM_TRUST_X_FORWARDED_FOR=1
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1 --no-proxy-headers --log-level info
    depends_on:
      - redis
    expose:
      - "8000"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Frontend (Nginx serving Vite static build) ─────────────────
  quantmind:
    profiles: [research]
    build:
      context: ./research
    restart: unless-stopped
    environment:
      - QUANTMIND_SERVICE_TOKEN=${QUANTMIND_SERVICE_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - QUANTMIND_MODEL=${QUANTMIND_MODEL:-gpt-4o-mini}
      - QUANTMIND_DB_PATH=/data/research.db
    volumes:
      - research_data:/data
    expose:
      - "8010"
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_BASE=/api
    restart: unless-stopped
    ports:
      - "${ATOM_BIND_ADDRESS:-127.0.0.1}:${ATOM_HTTP_PORT:-8080}:80"
    networks:
      - internal
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Redis (cache) ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - internal

  # ── Throwaway Postgres for CI's container smoke test only ──────
  # `docker compose --profile ci up` starts this; a plain `up` (real
  # deployment) never does — ATOM_DATABASE_URL must point at the
  # managed instance instead (see header comment).
  postgres:
    profiles: [ci]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atom
      POSTGRES_PASSWORD: atom_ci
      POSTGRES_DB: atom_ci
    expose:
      - "5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atom"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  internal:
    driver: bridge

volumes:
  redis_data:
  research_data:
