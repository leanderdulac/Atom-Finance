# Add explicitly to the production compose only after DNS/firewall are ready.
services:
  edge:
    image: caddy:2.11.2-alpine
    restart: unless-stopped
    environment:
      ATOM_DOMAIN: ${ATOM_DOMAIN:?Set the public hostname without scheme or path}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
    depends_on: [frontend]
    security_opt: [no-new-privileges:true]
  backend:
    environment:
      # Edge chain is client → Caddy → frontend nginx → backend, so the real
      # client is the X-Forwarded-For entry 2 hops from the right.
      ATOM_TRUST_PROXY_HOPS: "2"
volumes:
  caddy_data:
  caddy_config:
