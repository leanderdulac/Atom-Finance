name: ATOM Deploy
on:
  workflow_run:
    workflows: [ATOM CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: atom-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy the exact tested commit
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -eu
            TARGET_SHA='${{ github.event.workflow_run.head_sha }}' bash /opt/atom/scripts/deploy.sh
