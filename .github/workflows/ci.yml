name: ATOM CI

on:
  push:
    branches: [main, develop, "integration/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: pytest + dependency audit ────────────────────────────────────────────────────
  backend:
    name: Backend Tests & Dependency Audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atom
          POSTGRES_PASSWORD: atom_ci
          POSTGRES_DB: atom_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      ATOM_ENV: test
      SECRET_KEY: ci-test-secret-key-not-for-production
      ATOM_DATABASE_URL: postgresql+asyncpg://atom:atom_ci@localhost:5432/atom_ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install postgresql-client (pg_dump/pg_restore for the backup/restore test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Ruff lint
        run: |
          pip install ruff
          ruff check .

      - name: Static type check (basedpyright)
        run: |
          pip install basedpyright
          basedpyright

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run pytest (unit tests — no external APIs)
        run: |
          python -m pytest tests/ \
            --tb=short \
            -q \
            -x \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=50

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit --strict

  # ── Frontend: TypeScript check + build ───────────────────────────────────────
  frontend:
    name: Frontend Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate

      - name: ESLint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build production bundle (Vite)
        run: npm run build
        env:
          VITE_API_BASE: /api

      - name: Check bundle size
        run: |
          echo "=== Bundle sizes ==="
          du -sh dist/
          find dist -name "*.js" | xargs wc -c | sort -n | tail -5

  containers:
    name: Production container smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      SECRET_KEY: ci-container-only-secret-at-least-32-bytes
      ATOM_DATABASE_URL: postgresql+asyncpg://atom:atom_ci@postgres:5432/atom_ci
      ATOM_HTTP_PORT: "18080"
      ATOM_SMOKE_USER: production_test
      ATOM_SMOKE_PASSWORD: isolated-test-only-password
    steps:
      - uses: actions/checkout@v4
      # Migrations must precede the backend, not follow it: its lifespan calls
      # exclusive_runtime(), which UPDATEs the experiments table, so it cannot
      # start against an unmigrated database. Starting the stack first left the
      # backend crash-looping, --wait never satisfied, and the migration step
      # unreachable. docs/PRODUCTION.md step 4 migrates before the first deploy
      # for this reason; the smoke test now exercises that same order.
      - name: Start database
        run: docker compose -p atom-ci -f docker-compose.prod.yml --profile ci up -d --wait postgres
      - name: Run database migrations
        run: docker compose -p atom-ci -f docker-compose.prod.yml run --rm --build backend alembic upgrade head
      - name: Build and start isolated production stack
        run: docker compose -p atom-ci -f docker-compose.prod.yml --profile ci up -d --build --wait --wait-timeout 180
      - name: Provision test identity and verify API persistence
        run: |
          docker compose -p atom-ci -f docker-compose.prod.yml exec -T backend python -c 'import asyncio; from app.db.database import create_user; from app.core.security import hash_password; asyncio.run(create_user("production_test", "production@example.test", hash_password("isolated-test-only-password")))'
          python3 scripts/smoke-production.py
      - name: Container logs on failure
        if: failure()
        run: docker compose -p atom-ci -f docker-compose.prod.yml logs --tail 100
      - name: Stop test stack
        if: always()
        run: docker compose -p atom-ci -f docker-compose.prod.yml --profile ci down -v
