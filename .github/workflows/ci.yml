name: ATOM CI

on:
  push:
    branches: [main, develop, "integration/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: pytest + dependency audit ────────────────────────────────────────────────────
  backend:
    name: Backend Tests & Dependency Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Ruff lint
        run: |
          pip install ruff
          ruff check .

      - name: Static type check (basedpyright)
        run: |
          pip install basedpyright
          basedpyright

      - name: Run pytest (unit tests — no external APIs)
        env:
          ATOM_ENV: test
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: |
          python -m pytest tests/ \
            --tb=short \
            -q \
            -x \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=40

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit --strict

  # ── Frontend: TypeScript check + build ───────────────────────────────────────
  frontend:
    name: Frontend Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate

      - name: ESLint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build production bundle (Vite)
        run: npm run build
        env:
          VITE_API_BASE: /api

      - name: Check bundle size
        run: |
          echo "=== Bundle sizes ==="
          du -sh dist/
          find dist -name "*.js" | xargs wc -c | sort -n | tail -5

  containers:
    name: Production container smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      SECRET_KEY: ci-container-only-secret-at-least-32-bytes
      ATOM_HTTP_PORT: "18080"
      ATOM_SMOKE_USER: production_test
      ATOM_SMOKE_PASSWORD: isolated-test-only-password
    steps:
      - uses: actions/checkout@v4
      - name: Build and start isolated production stack
        run: docker compose -p atom-ci -f docker-compose.prod.yml up -d --build --wait --wait-timeout 180
      - name: Provision test identity and verify API persistence
        run: |
          docker compose -p atom-ci -f docker-compose.prod.yml exec -T backend python -c 'from app.db.database import create_user; from app.core.security import hash_password; create_user("production_test", "production@example.test", hash_password("isolated-test-only-password"))'
          python3 scripts/smoke-production.py
      - name: Stop test stack
        if: always()
        run: docker compose -p atom-ci -f docker-compose.prod.yml down -v
