name: B3 paper forward

on:
  schedule:
    # 22:00 UTC is 19:00 in Brasília. Brazil does not use daylight saving.
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b3-paper-forward
  cancel-in-progress: false

jobs:
  mark:
    name: Mark the paper books
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the pricing libraries
        run: pip install numpy==1.26.4 scipy==1.14.1

      - name: Mark sessions that already have a close
        env:
          PYTHONPATH: backend
        run: python scripts/run_b3_paper_forward.py --mark-to-market

      - name: Write the monthly report
        env:
          PYTHONPATH: backend
        run: python scripts/run_b3_paper_forward.py --monthly-report

      - name: Commit the ledger and the report
        run: |
          git add docs/reports/b3_paper docs/reports/b3-paper-preregistration.json
          if git diff --cached --quiet; then
            echo "no paper changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Record the B3 paper forward mark"
            git push
          fi
