name: ATOM Research
on: [push, pull_request]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install -e 'quantmind[dev]'
        working-directory: research
      - run: bash scripts/verify.sh
        working-directory: research/quantmind
      - run: PYTHONPATH=. python -m pytest tests -q
        working-directory: research
